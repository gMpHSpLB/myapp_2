apiVersion: v1
kind: Pod
metadata:
  name: alpha-client
  namespace: team-alpha
  labels:
    app: client
    team: alpha
spec:
  containers:
  - name: client
    image: curlimages/curl:8.10.1
    command: ["sh", "-c", "sleep 3600"]
# You’ll use these to show that team-beta cannot reach team-alpha’s server 
# once policies are in place, which is a standard “isolate namespaces with 
# NetworkPolicy” pattern.